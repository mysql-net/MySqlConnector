name: Integration Tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner to test on. Linux runners use a Docker container for the server; Windows runners install MySQL Server locally.
        type: string
        required: true
      tfm:
        description: The target framework to test.
        type: string
        required: true
      configuration:
        description: The build configuration to test (Release for MySqlConnector, MySqlData for MySql.Data).
        type: string
        default: Release
      docker-image:
        description: The Docker image of the database server (Linux only).
        type: string
        default: ''
      unsupported-features:
        description: The ServerFeatures that the server doesn't support.
        type: string
        required: true
      user:
        description: The user to connect as.
        type: string
        default: mysqltest
      connection-string-extra:
        description: Extra connection string options.
        type: string
        default: ''
      variants:
        description: 'JSON array of the connection variants to test: "nossl", "ssl", "compression".'
        type: string
        default: '["nossl", "ssl", "compression"]'
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub user name; used (if set) to avoid anonymous pull rate limits.
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub access token.
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    env:
      CONNECTION_OPTIONS: server=localhost;port=3306;user id=${{ inputs.user }};password=test;DefaultCommandTimeout=3600
      DATA__UNSUPPORTEDFEATURES: ${{ inputs.unsupported-features }}
      DATA__CERTIFICATESPATH: ${{ github.workspace }}/.ci/server/certs/
      DATA__MYSQLBULKLOADERLOCALCSVFILE: ${{ github.workspace }}/tests/TestData/LoadData_UTF8_BOM_Unix.CSV
      DATA__MYSQLBULKLOADERLOCALTSVFILE: ${{ github.workspace }}/tests/TestData/LoadData_UTF8_BOM_Unix.TSV
      DATA__SOCKETPATH: ${{ github.workspace }}/.ci/run/mysql/mysqld.sock
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TEST_NAME: ${{ inputs.configuration == 'MySqlData' && 'MySql.Data integration tests' || 'Integration tests' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
        with:
          target-framework: ${{ inputs.tfm }}

      - name: Restore test binaries
        uses: ./.github/actions/restore-test-binaries

      - name: Log in to Docker Hub
        if: runner.os == 'Linux' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start ${{ inputs.docker-image || 'MySQL Server' }}
        id: server
        shell: pwsh
        run: |
          if ($IsWindows) {
            ./.ci/start-mysql-windows.ps1 -InstallPath "$env:RUNNER_TEMP/mysql"
          } else {
            ./.ci/docker-run.sh $env:DOCKER_IMAGE 3306 $env:DATA__UNSUPPORTEDFEATURES
          }
        env:
          DOCKER_IMAGE: ${{ inputs.docker-image }}

      - name: Conformance tests
        if: inputs.configuration == 'Release' && hashFiles(format('artifacts/bin/Conformance.Tests/release_{0}/*.dll', inputs.tfm)) != ''
        uses: ./.github/actions/run-tests
        env:
          CONNECTION_STRING: ${{ env.CONNECTION_OPTIONS }};database=conformance;ssl mode=disabled;${{ inputs.connection-string-extra }}
        with:
          project: Conformance.Tests
          target-framework: ${{ inputs.tfm }}
          title: Conformance tests

      - name: ${{ env.TEST_NAME }} (No SSL)
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(fromJSON(inputs.variants), 'nossl') }}
        uses: ./.github/actions/run-tests
        env:
          DATA__CONNECTIONSTRING: ${{ env.CONNECTION_OPTIONS }};database=mysqltest;ssl mode=disabled;${{ inputs.connection-string-extra }}
        with:
          project: IntegrationTests
          target-framework: ${{ inputs.tfm }}
          configuration: ${{ inputs.configuration }}
          title: ${{ env.TEST_NAME }} (No SSL)

      - name: ${{ env.TEST_NAME }} (SSL)
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(fromJSON(inputs.variants), 'ssl') }}
        uses: ./.github/actions/run-tests
        env:
          DATA__CONNECTIONSTRING: ${{ env.CONNECTION_OPTIONS }};database=mysqltest;ssl mode=required;certificate file=${{ github.workspace }}/.ci/server/certs/ssl-client.pfx;${{ inputs.connection-string-extra }}
        with:
          project: IntegrationTests
          target-framework: ${{ inputs.tfm }}
          configuration: ${{ inputs.configuration }}
          title: ${{ env.TEST_NAME }} (SSL)

      - name: ${{ env.TEST_NAME }} (Compression)
        if: ${{ !cancelled() && steps.server.outcome == 'success' && contains(fromJSON(inputs.variants), 'compression') }}
        uses: ./.github/actions/run-tests
        env:
          DATA__CONNECTIONSTRING: ${{ env.CONNECTION_OPTIONS }};database=mysqltest;ssl mode=disabled;UseCompression=True;${{ inputs.connection-string-extra }}
        with:
          project: IntegrationTests
          target-framework: ${{ inputs.tfm }}
          configuration: ${{ inputs.configuration }}
          title: ${{ env.TEST_NAME }} (Compression)

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-test-results
        with:
          name: integration ${{ inputs.configuration }} ${{ inputs.docker-image || runner.os }} ${{ inputs.tfm }}
